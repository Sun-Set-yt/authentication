<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firebase Login</title>

<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-auth-compat.js"></script>
</head>

<body>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="signIn()">Sign In</button>
<button onclick="alert('🔥 button works')">Click Me</button>


<script>

// Firebase setup
firebase.initializeApp({
  apiKey: "AIzaSyDp_NHuDUAbombE232ElUZBtyq_3yuolGM",
  authDomain: "auth-form-3983f.firebaseapp.com",
  projectId: "auth-form-3983f"
  storageBucket: "auth-form-3983f.firebasestorage.app",
  messagingSenderId: "201135136045",
  appId: "1:201135136045:web:96d49a1adeb2130bba47a4",
  measurementId: "G-NFY2C27LW9"
});

// Sign In
function signIn() {
   const email = document.getElementById("email").value;
   const password = document.getElementById("password").value;

   firebase.auth().signInWithEmailAndPassword(email, password)
   .then(() => {
      alert("Signed In 🔥");
   })
   .catch((error) => {
      alert(error.message);
   });
}

</script>

</body>
</html>
