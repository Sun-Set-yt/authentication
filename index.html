<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Auth</title>

<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.12.1/firebase-auth-compat.js"></script>

<style>
body{
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    width:300px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="box">

<h2>Firebase Login 🔥</h2>

<input type="email" id="email" placeholder="Enter Email">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="signUp()">Sign Up</button>

<button onclick="signIn()">Sign In</button>

<button onclick="logout()">Logout</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const redirect = params.get("redirect");

if(redirect){
    localStorage.setItem("redirectAfterLogin", redirect);
    console.log("Saved redirect:", redirect);
}

// Firebase Setup
firebase.initializeApp({
  apiKey: "AIzaSyBheujHYv5YXKvFOossN_UHbpFyndUTWs4",
  authDomain: "auth-form-3983f.firebaseapp.com",
  projectId: "auth-form-3983f",
  storageBucket: "auth-form-3983f.firebasestorage.app",
  messagingSenderId: "201135136045",
  appId: "1:201135136045:web:96d49a1adeb2130bba47a4"
});

// 🎯 DIRECT redirect reader (NO STORAGE)
function getRedirect(){
    return new URLSearchParams(window.location.search).get("redirect");
}

// SIGN UP
function signUp(){

    alert("Please wait... Processing ⏳");

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    firebase.auth().createUserWithEmailAndPassword(email,password)

    .then((userCredential)=>{
        alert("Account Created 🎉");
        console.log(userCredential);
    })

    .catch((error)=>{
        alert(error.message);
        console.log(error);
    });
}

// SIGN IN
function signIn(){

    alert("Please wait... Processing ⏳");
  
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    firebase.auth().signInWithEmailAndPassword(email,password)

    .then((user)=>{

        alert("Login Successful 🔥");

        // ✅ SAVE USER
        localStorage.setItem("firebaseUser", userCredential.user.email);

        const redirectUrl = getRedirect();
        // ✅ GET REDIRECT
        const redirectUrl = localStorage.getItem("redirectAfterLogin");
        console.log("Reading redirect:", redirectUrl);
        console.log("Redirect URL:", redirectUrl);
        console.log("ALL STORAGE:", localStorage);
        console.log("REDIRECT VALUE:", localStorage.getItem("redirectAfterLogin"));
        
        // ✅ REDIRECT
        if(redirectUrl){
            localStorage.removeItem("redirectAfterLogin");
            window.location.href = redirectUrl;
        } else {
            alert("No redirect found ❌");
            
        }

    })

    .catch((error)=>{
        alert(error.message);
        console.log(error);
    });
}

// LOGOUT
function logout(){

    firebase.auth().signOut()

    .then(()=>{
        alert("Logged Out 👋");
    })

    .catch((error)=>{
        alert(error.message);
    });
}

</script>

</body>
</html>
